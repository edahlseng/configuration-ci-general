version: 2.1

description: General purpose continuous integration configuration

orbs:
  circleci-cli: circleci/circleci-cli@0.1.8
  orbs: circleci/orb-tools@10.0.0
  node: circleci/node@5.0.0

executors:
  node:
    docker:
      - image: cimg/node:lts
        user: circleci
    resource_class: medium+
  buildpack-deps:
    docker:
      - image: cimg/base:current-22.04
        user: circleci
  terraform:
    parameters:
      tag:
        type: string
        default: "latest"
    docker:
      - image: hashicorp/terraform:<< parameters.tag >>

commands:
  check-isolated-deployment-label:
    steps:
      - run:
          name: Checking for isolated-deployment label
          command: |
            if [[ -z "${CIRCLE_PULL_REQUEST##*/}" ]]; then
              echo "Job is not running for a pull request. Halting the job."
              circleci-agent step halt
              exit 0;
            fi

            PR_NUMBER=$(echo $CIRCLE_PULL_REQUEST | sed 's/.*\/pull\/\([0-9]*\)/\1/')
            LABELS=$(curl -s -H "Authorization: token $RELEASE_BOT_GITHUB_TOKEN" \
                          -H "Accept: application/vnd.github.v3+json" \
                          https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls/$PR_NUMBER \
                          | jq -r '.labels | .[].name')
            echo "Labels found: $LABELS"
            if ! echo "$LABELS" | grep -q "isolated-deployment"; then
              echo "Label 'isolated-deployment' not found. Halting the job."
              circleci-agent step halt
            else
              echo "Label 'isolated-deployment' found. Continuing the job."
            fi
  terraform-plan-comment:
    parameters:
      directory:
        type: string
      tf-plan:
        type: string
        description: Path to an existing terraform.plan file
    steps:
      - run:
          name: Attach Terraform Plan to Pull Request
          command: |
            PR_NUMBER=$(echo $CIRCLE_PULL_REQUEST | awk -F '/' '{print $NF}')
            if [ -n "$PR_NUMBER" ]; then
              sudo apt-get update && sudo apt-get install jq
              cd << parameters.directory >>
              TFPLAN_OUTPUT=$(terraform show -no-color << parameters.tf-plan >>)
              ESCAPED_OUTPUT=$(echo "$TFPLAN_OUTPUT" | jq -Rrs '@json' | sed 's/^"//' | sed 's/"$//')
              COMMENT_PAYLOAD="{\"body\":\"**Terraform Plan Output**\n\`\`\`"$ESCAPED_OUTPUT"\`\`\`\"}"

              # Check if there is an existing comment from the bot
              EXISTING_COMMENT_URL=$(curl -sSL -H "Authorization: token $RELEASE_BOT_GITHUB_TOKEN" -H "Content-Type: application/json" "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/issues/$PR_NUMBER/comments" | jq -r '.[] | select(.user.login == "web-github-ci") | .url')
              if [ -n "$EXISTING_COMMENT_URL" ]; then
                # Delete the existing comment
                curl -sSL -H "Authorization: token $RELEASE_BOT_GITHUB_TOKEN" -H "Content-Type: application/json" -X DELETE "$EXISTING_COMMENT_URL"
              fi

              # Create new comment
              curl -sSL -H "Authorization: token $RELEASE_BOT_GITHUB_TOKEN" -H "Content-Type: application/json" -X POST --data "$COMMENT_PAYLOAD" "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/issues/$PR_NUMBER/comments"
            else
              echo "Not a pull request build. Skipping comment."
            fi
  put-all:
    description: Save all files to the workspace
    steps:
      - persist_to_workspace:
          root: . # relative to working_directory
          paths: # relative to root
            - .
  put-directory: # Deprecated (use put-path, instead)
    description: Save all files to the workspaces
    parameters:
      path:
        type: string
    steps:
      - persist_to_workspace:
          root: . # relative to working_directory
          paths: # relative to root
            - << parameters.path >>
  put-path:
    description: Save path to the workspace
    parameters:
      relative-to:
        type: string
        default: . # relative to working_directory
      path:
        type: string
    steps:
      - persist_to_workspace:
          root: << parameters.relative-to >>
          paths: # relative to root
            - << parameters.path >>
  put-test-results:
    description: Save test results
    parameters:
      path:
        type: string
    steps:
      - store_test_results:
          path: << parameters.path >>
      - store_artifacts:
          path: << parameters.path >>
  get-workspace:
    description: Load all files from workspace
    steps:
      - attach_workspace:
          at: . # relative from working_directory
  halt-if-not-release-commit:
    description: Check commit message for chore(release), halting job if false
    steps:
      - run:
          name: Ensuring commit is a release commit
          command: |
            if [[ ! $(git log --format=%b -n 1 ${CIRCLE_SHA1}) =~ "New Release:" ]]; then
              echo "Not a release commit, halting"
              circleci-agent step halt
            fi
  halt-if-release-commit:
    description: Check commit message for chore(release), halting job if true
    steps:
      - run:
          name: Ensuring commit is not a release commit
          command: |
            if [[ $(git log --format=%b -n 1 ${CIRCLE_SHA1}) =~ "New Release:" ]]; then
              echo "Release commit, halting"
              circleci-agent step halt
            fi
  add-github-to-known-hosts:
    description: Add GitHub RSA key to known_hosts file, to support SSH with GitHub
    steps:
      - run:
          name: Adding GitHub to known_hosts file
          command: |
            mkdir -p ~/.ssh

            echo 'github.com ssh-rsa 
            ' >> ~/.ssh/known_hosts
  setup-git-user:
    description: Configures Git so that actions are performed on behalf of the specified user
    parameters:
      git-ssh-fingerprint:
        type: string
      git-user-email:
        type: string
      git-user-name:
        type: string
    steps:
      - add_ssh_keys:
          fingerprints:
            - << parameters.git-ssh-fingerprint >>
      - add-github-to-known-hosts
      - run:
          name: Configuring Git user
          command: |
            git config --global user.email "<< parameters.git-user-email >>"
            git config --global user.name "<< parameters.git-user-name >>"
  tag:
    description: Tag current release commit and push the new tag
    steps:
      - run:
          name: Creating Git tag
          command: |
            versionTag=$(git log --format=%b -n 1 ${CIRCLE_SHA1} | sed -r 's/New Release: //')

            echo "Tagging commit"
            git tag "${versionTag}"
      - run:
          name: Pushing tag to Git remote
          command: git push --tags
      - put-directory:
          path: .git
  configure-aws-profile:
    parameters:
      aws-role-variable-name:
        type: string
        default: AWS_ROLE
      aws-access-key-id-variable-name:
        type: string
        default: AWS_ACCESS_KEY_ID
      aws-secret-access-key-variable-name:
        type: string
        default: AWS_SECRET_ACCESS_KEY
      profile-name:
        type: string
        default: infrastructure
      region:
        type: string
        default: us-east-1
    steps:
      - run:
          name: Configuring AWS profile
          command: |
            mkdir -p ~/.aws

            cat \<<EOF >> ~/.aws/credentials
            [<< parameters.profile-name >>-credentials]
            aws_access_key_id = ${<< parameters.aws-access-key-id-variable-name >>}
            aws_secret_access_key = ${<< parameters.aws-secret-access-key-variable-name >>}

            [<< parameters.profile-name >>]
            source_profile = << parameters.profile-name >>-credentials
            role_arn = ${<< parameters.aws-role-variable-name >>}
            region = << parameters.region >>

            EOF

            if [ "<< parameters.aws-access-key-id-variable-name >>" = "AWS_ACCESS_KEY_ID" ] && \
               [ "<< parameters.aws-secret-access-key-variable-name >>" = "AWS_SECRET_ACCESS_KEY" ]; then
              # Avoid using default credentials from environment in favor of configured profiles. 
              echo 'unset AWS_ACCESS_KEY_ID' >> ${BASH_ENV}
              echo 'unset AWS_SECRET_ACCESS_KEY' >> ${BASH_ENV}
            fi
            echo 'export AWS_PROFILE="<< parameters.profile-name >>"' >> ${BASH_ENV}
            echo 'export AWS_SDK_LOAD_CONFIG=1' >> ${BASH_ENV}
  login-ecr:
    parameters:
      aws-region:
        type: string
    steps:
      - run:
          name: Logging in to ECR
          command: |
            if ! which aws > /dev/null; then
              sudo apt-get update --allow-releaseinfo-change && sudo apt-get install -y python3-pip
              sudo pip3 install awscli
            fi

            login="$(aws ecr get-login --no-include-email --region << parameters.aws-region >>)"
            ${login}
  select-or-create-workspace:
    parameters:
      directory:
        type: string
      workspace-name:
        type: string
    steps:
      - run:
          name: Switching to Terraform workspace << parameters.workspace-name >>
          command: |
            function cleanedUpWorkspaces() {
              sed -E 's/^\*? *([^ ]+) *$/\1/'
            }

            workspaceName="<< parameters.workspace-name >>"

            cd << parameters.directory >>
            if [[ -z "$(terraform workspace list | cleanedUpWorkspaces | grep "${workspaceName}")" ]]; then
              echo "Workspace does not currently exist; creating"
              terraform workspace new "${workspaceName}"
            else
              echo "Workspace already exists; selecting"
              terraform workspace select "${workspaceName}"
            fi
  halt-if-not-pr:
    description: Check if current workflow is associated with a pull request, halting job if false
    steps:
      - run:
          name: Ensuring workflow is associated with a pull request
          command: |
            prNumber="${CIRCLE_PR_NUMBER:-${CIRCLE_PULL_REQUEST##*/}}"

            if [[ -z "${prNumber}" ]]; then
              echo "This workflow is not associated with a pull request; halting"
              circleci-agent step halt
            fi
  post-pr-comment:
    parameters:
      comment:
        type: string
      github-access-token:
        type: string
    steps:
      - halt-if-not-pr
      - run:
          name: Posting comment to pull request
          command: |
            prNumber="${CIRCLE_PR_NUMBER:-${CIRCLE_PULL_REQUEST##*/}}"

            statusCode=$(curl -X POST \
              -H 'Accept: application/vnd.github.v3+json' \
              -H "Authorization: token << parameters.github-access-token >>" \
              --output curl.log \
              --write-out "%{http_code}" \
              "https://api.github.com/repos/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/issues/${prNumber}/comments" \
              --data @- \<<-EOF
                {
                  "body": "<< parameters.comment >>"
                }
            EOF
            )

            cat curl.log

            if [[ "${statusCode}" -lt "200" ]] || [[ "${statusCode}" -gt "299" ]]; then
              exit 1
            fi
  set-up-npm-authentication:
    parameters:
      npm-authentication-token:
        type: string
    steps:
      - run:
          name: Setting up NPM authentication
          command: |
            echo "//registry.npmjs.org/:_authToken=<< parameters.npm-authentication-token >>" > .npmrc
            npm whoami
  check-docker-image-service-health:
    parameters:
      docker-image:
        type: string
      docker-run-arguments:
        type: string
        default: ""
      health-check-use-https:
        type: boolean
        default: false
      health-check-port:
        type: integer
        default: 80
      health-check-path:
        type: string
    steps:
      - run:
          name: Checking service health from Docker image
          command: |
            echo "Creating container..."

            containerId=$(docker run << parameters.docker-run-arguments >> --detach << parameters.docker-image >>)

            echo "Checking health of container..."
            healthCheckPassed="false"
            protocol="http<<# parameters.health-check-use-https >>s<</ parameters.health-check-use-https >>"
            for index in {1..10}; do
              # We use wget below, as it should be available even on Alpine Linux. Redirecting stderr to stdout
              # helps ensure that the server response is printed before the request body
              if docker exec "${containerId}" wget -q -S -O - "${protocol}://127.0.0.1:<< parameters.health-check-port >><< parameters.health-check-path >>" 2>&1; then
                healthCheckPassed="true"
                break
              fi
              sleep 1 # Wait one second
            done

            statusCode=1
            if [[ "${healthCheckPassed}" == "true" ]]; then
              statusCode=0
            else
              echo "Health check failed. Container logs:"
              docker logs "${containerId}"
            fi

            docker stop "${containerId}" > /dev/null || true
            docker rm "${containerId}" > /dev/null

            exit ${statusCode}
  install-dependencies-yarn:
    parameters:
      install-yarn:
        type: boolean
        default: true
      directory:
        type: string
    steps:
      - node/install:
          install-yarn: << parameters.install-yarn >>
      - restore_cache:
          key: node_modules-{{ arch }}-{{ checksum "<< parameters.directory >>/yarn.lock" }}
      - run:
          name: Installing Yarn dependencies
          command: |
            cd << parameters.directory >>
            if [[ -e "yarn.lock" ]]; then
              if [[ -d "node_modules" ]]; then
                echo "Cached node_modules found. Skipping install step."
              else
                echo "yarn.lock found, but no cached modules found. Installing with \`yarn install --frozen-lockfile\`..."
                echo ""

                yarn install --frozen-lockfile
              fi
            elif [[ -e "package.json" ]]; then
              echo "No yarn.lock found, but package.json found. Installing with \`yarn install\`..."
              echo ""

              yarn install
            fi
      - save_cache:
          key: node_modules-{{ arch }}-{{ checksum "<< parameters.directory >>/yarn.lock" }}
          paths:
            - << parameters.directory >>/node_modules
  install-dependencies-npm:
    steps:
      - node/install
      - restore_cache:
          key: node_modules-{{ arch }}-{{ checksum "package-lock.json" }}
      - run:
          name: Installing NPM dependencies
          command: |
            if [[ -e "package-lock.json" ]]; then
              if [[ -d "node_modules" ]]; then
                echo "Cached node_modules found. Skipping install step."
              else
                echo "package-lock.json found, but no cached modules found. Installing with \`npm ci\`..."
                echo ""

                npm ci
              fi
            elif [[ -e "package.json" ]]; then
              echo "No package-lock.json found, but package.json found. Installing with \`npm install\`..."
              echo ""

              npm install
            fi
      - save_cache:
          key: node_modules-{{ arch }}-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
  install-dependencies-clojure:
    steps:
      - run:
          name: Backing up ~/.m2 directory (if it exists)
          command: |
            if [[ -e ~/.m2 ]]; then
              mv ~/.m2 ~/.m2-temp
            fi
      - restore_cache:
          key: clojure-1.10.1.492-{{ arch }}-{{ checksum "deps.edn" }}
      - run:
          name: Installing Clojure dependencies
          command: |
            if [[ -e "deps.edn" ]]; then
              if [[ -d ~/.m2 ]]; then
                echo "Cached dependencies found. Skipping install step."
              else
                echo "deps.edn found, but no cached dependencies found. Installing dependencies..."
                echo ""

                echo "Installing Clojure"
                sudo apt-get install openjdk-11-jdk
                sudo curl -o /tmp/linux-install-clojure.sh https://download.clojure.org/install/linux-install-1.10.1.492.sh
                sudo chmod +x /tmp/linux-install-clojure.sh
                sudo /tmp/linux-install-clojure.sh
                echo ""

                clojure -Spath # In order to make the classpath, resolve-deps has to be called, which downloads dependencies
              fi
            fi
      - save_cache:
          key: clojure-1.10.1.492-{{ arch }}-{{ checksum "deps.edn" }}
          paths:
            - .cpcache
            - ~/.m2
      - run:
          name: Merging backed up ~/.m2 directory into new ~/.m2 directory (if they exist)
          command: |
            if [[ -e ~/.m2-temp && ! -e ~/m2 ]]; then
              mv ~/.m2-temp ~/.m2
            fi

            if [[ -e ~/.m2-temp && -e ~/.m2 ]]; then
              echo "Installing merge-directories"
              wget https://github.com/edahlseng/merge-directories/releases/download/v0.1.0/merge-directories_v0.1.0_linux_amd64.zip
              unzip merge-directories_v0.1.0_linux_amd64.zip
              rm merge-directories_v0.1.0_linux_amd64.zip
              ./merge-directories_v0.1.0_linux_amd64 --mv ~/.m2-temp ~/.m2
              rm ./merge-directories_v0.1.0_linux_amd64
            fi
  install-required-terraform-version:
    parameters:
      directory:
        type: string
    steps:
      - run:
          name: Installing required Terraform version
          command: |
            cd << parameters.directory >>
            curl -L https://raw.githubusercontent.com/warrensbox/terraform-switcher/master/install.sh | sudo bash -s -- 1.4.4
            [[ -f versions.tf ]] && filename="versions.tf" || filename="main.tf"
            desiredTerraformVersion=$(cat ${filename} | grep --extended-regexp '^\s*required_version\s*=\s*"\s*(=|>=)?\s*[0-9]+\.[0-9]+\.[0-9]+\s*"\s*$' | head | sed -E 's/^.*([0-9]+\.[0-9]+\.[0-9]+).*$/\1/')
            tfswitch "${desiredTerraformVersion}"
  install-terraform-version:
    parameters:
      version:
        type: string
    steps:
      - run:
          name: Installing Terraform Version << parameters.version >>
          command: |
            curl -L https://raw.githubusercontent.com/warrensbox/terraform-switcher/refs/tags/v1.4.6/install.sh | sudo bash
            tfswitch << parameters.version >>
  create-terraform-plan:
    parameters:
      directory:
        type: string
      lock-timeout:
        type: string
    steps:
      - run:
          name: Creating Terraform Plan
          command: cd << parameters.directory >> && terraform plan -input=false -lock-timeout=<< parameters.lock-timeout >> -out=terraform.plan | tee terraform-output.log
  apply-terraform-plan:
    parameters:
      directory:
        type: string
      ignore-missing-plan:
        type: boolean
      lock-timeout:
        type: string
    steps:
      - run:
          name: Applying Terraform Plan
          command: |
            cd << parameters.directory >>

            <<# parameters.ignore-missing-plan >>
              if [[ -e "terraform.plan" ]]; then
                terraform apply -input=false -lock-timeout=<< parameters.lock-timeout >> "terraform.plan" | tee terraform-output.log
              else
                terraform apply -input=false -lock-timeout=<< parameters.lock-timeout >> -auto-approve | tee terraform-output.log
              fi
              exit
            <</ parameters.ignore-missing-plan >>

            terraform apply -input=false -lock-timeout=<< parameters.lock-timeout >> "terraform.plan" | tee terraform-output.log
  run-pre-init-script:
    description: Runs a pre-init.sh script, primarily used for setting up third-party Terraform providers
    parameters:
      directory:
        type: string
    steps:
      - run:
          name: Running pre-init script
          command: |
            if [[ -e << parameters.directory >>/pre-init.sh ]]; then
              << parameters.directory >>/pre-init.sh
            fi
  set-up-environment-variables-from-suffix:
    description: Sets up environment variables from source variables that have a specified suffix
    parameters:
      suffix:
        type: string
    steps:
      - run:
          name: Setting up environment variables
          command: |
            for variable in $(compgen -e | grep -E "<< parameters.suffix >>$"); do
              echo "Creating ${variable%<< parameters.suffix >>} variable, from ${variable}"
              echo "export ${variable%<< parameters.suffix >>}=\"${!variable}\"" >> ${BASH_ENV}
            done
  set-up-terraform-variables:
    description: Saves Terraform variables to a terraform.tfvars file. This command does not do much other than allow for easier to understand syntax in a .circleci/config.yml file.
    parameters:
      directory:
        type: string
      variables:
        type: string
    steps:
      - run:
          name: Setting up Terraform variables
          command: echo "<< parameters.variables >>" | tee -a << parameters.directory >>/terraform.tfvars
  log-in-to-docker-hub:
    description: Logs the current Docker daemon into Docker Hub
    parameters:
      username:
        type: string
      password:
        type: string
    steps:
      - run:
          name: Logging in to Docker Hub
          command: echo "<< parameters.password >>" | docker login -u "<< parameters.username >>" --password-stdin
  halt:
    description: Halts the job if the specified condition is true
    parameters:
      if:
        type: string
    steps:
      - run:
          name: Ensuring job should continue
          command: |
            if << parameters.if >>; then
              echo "Condition not met, halting"
              circleci-agent step halt
            fi
  tag-current-commit:
    description: Creates a Git tag for the current commit, and pushes that tag to the Git remote
    parameters:
      tag:
        type: string
    steps:
      - run:
          name: Creating Git tag
          command: git tag "<< parameters.tag >>"
      - put-directory:
          path: .git
      - run:
          name: Pushing tag to Git remote
          command: git push --tags

  calculate-semantic-version:
    description: Calculate next semantic version using semantic-release with fallback for non-conventional commits
    parameters:
      version-env-var:
        description: Environment variable to store the calculated version
        type: string
        default: SEMANTIC_VERSION
      default-version:
        description: Default version if no semver tags exist
        type: string
        default: "1.0.0"
      fallback-to-patch:
        description: If true, bump patch version when semantic-release finds no releasable commits but changes exist
        type: boolean
        default: true
    steps:
      - run:
          name: Calculating semantic version with semantic-release
          command: |
            set -e

            DEFAULT_VERSION="<< parameters.default-version >>"
            FALLBACK_TO_PATCH="<< parameters.fallback-to-patch >>"

            # Add GitHub to known hosts
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

            # Create minimal semantic-release config
            echo '{"branches":["master","main"],"tagFormat":"${version}","plugins":["@semantic-release/commit-analyzer"]}' > .releaserc.json

            # semantic-release always verifies push access via `git ls-remote` over HTTPS,
            # even with only commit-analyzer configured, so it needs a GH_TOKEN to authenticate.
            export GH_TOKEN="${RELEASE_BOT_GITHUB_TOKEN}"

            # Run semantic-release in dry-run mode
            echo "Running semantic-release --dry-run..."
            OUTPUT=$(npx --yes semantic-release --dry-run --no-ci 2>&1) || true

            echo "semantic-release output:"
            echo "$OUTPUT"

            # Extract the next version
            NEXT_VERSION=$(echo "$OUTPUT" | grep -oP "The next release version is \K[0-9]+\.[0-9]+\.[0-9]+" || true)

            # Clean up
            rm -f .releaserc.json

            if [[ -n "$NEXT_VERSION" ]]; then
              echo "Next version from semantic-release: $NEXT_VERSION"
              echo "export << parameters.version-env-var >>='${NEXT_VERSION}'" >> ${BASH_ENV}
              exit 0
            fi

            echo "No version detected by semantic-release."

            # Fallback: bump patch if there are commits since last tag
            if [[ "$FALLBACK_TO_PATCH" != "true" ]]; then
              echo "Fallback disabled. No version will be set."
              echo "export << parameters.version-env-var >>=''" >> ${BASH_ENV}
              exit 0
            fi

            LATEST_TAG=$(git tag --list --sort=-version:refname 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

            if [[ -z "$LATEST_TAG" ]]; then
              echo "No existing semver tags found. Using default version: ${DEFAULT_VERSION}"
              echo "export << parameters.version-env-var >>='${DEFAULT_VERSION}'" >> ${BASH_ENV}
              exit 0
            fi

            COMMIT_COUNT=$(git rev-list ${LATEST_TAG}..HEAD --count 2>/dev/null || echo "0")

            if [[ "$COMMIT_COUNT" -eq 0 ]]; then
              echo "No commits since last tag. No version bump needed."
              echo "export << parameters.version-env-var >>=''" >> ${BASH_ENV}
              exit 0
            fi

            echo "Found $COMMIT_COUNT commits since $LATEST_TAG. Applying fallback patch bump."

            MAJOR=$(echo $LATEST_TAG | cut -d. -f1)
            MINOR=$(echo $LATEST_TAG | cut -d. -f2)
            PATCH=$(echo $LATEST_TAG | cut -d. -f3)

            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

            echo "Fallback version: $NEXT_VERSION"
            echo "export << parameters.version-env-var >>='${NEXT_VERSION}'" >> ${BASH_ENV}

  argo-deploy:
    description: Deploy application via Argo CD with automated sync
    parameters:
      app-name:
        description: Argo CD application name
        type: string
      image-tag:
        description: Docker image tag to deploy
        type: string
      image-param:
        description: Helm parameter path for image tag (e.g., image.tag)
        type: string
        default: "shaper-app.image.tag"
      project:
        description: Argo CD project name
        type: string
        default: "shapertools-applications-staging"
      server-env-var:
        description: Environment variable containing Argo CD server URL
        type: string
        default: ARGOCD_SERVER_URL
      token-env-var:
        description: Environment variable containing Argo CD auth token
        type: string
        default: ARGOCD_TOKEN
    steps:
      - run:
          name: Installing Argo CD CLI
          command: |
            if ! which argocd > /dev/null; then
              curl -sSL -o /tmp/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
              chmod +x /tmp/argocd
              sudo mv /tmp/argocd /usr/local/bin/argocd
            fi
      - run:
          name: Deploying << parameters.app-name >> via Argo CD
          command: |
            set -e

            ARGOCD_SERVER="${<< parameters.server-env-var >>}"
            ARGOCD_AUTH_TOKEN="${<< parameters.token-env-var >>}"

            if [[ -z "$ARGOCD_SERVER" ]]; then
              echo "Error: << parameters.server-env-var >> environment variable is not set"
              exit 1
            fi

            if [[ -z "$ARGOCD_AUTH_TOKEN" ]]; then
              echo "Error: << parameters.token-env-var >> environment variable is not set"
              exit 1
            fi

            # Strip protocol prefix if present (argocd CLI expects bare hostname)
            ARGOCD_SERVER="${ARGOCD_SERVER#https://}"

            ARGOCD_OPTS="--server $ARGOCD_SERVER --auth-token $ARGOCD_AUTH_TOKEN --grpc-web"

            echo "Setting image tag << parameters.image-tag >> on << parameters.app-name >>"
            argocd $ARGOCD_OPTS app set "<< parameters.app-name >>" \
              --sync-policy automated \
              --self-heal \
              --project "<< parameters.project >>" \
              -p "<< parameters.image-param >>=<< parameters.image-tag >>"

            echo "Deployment triggered for << parameters.app-name >>. Argo CD will sync automatically."

