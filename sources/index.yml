  create-semantic-release:
    description: Calculate semantic version and create git tag using semantic-release with fallback
    executor: node
    parameters:
      git-ssh-fingerprint:
        type: string
      git-user-email:
        type: string
      git-user-name:
        type: string
      default-version:
        description: Default version if no semver tags exist
        type: string
        default: "1.0.0"
      fallback-to-patch:
        description: If true, bump patch version when semantic-release finds no releasable commits but changes exist
        type: boolean
        default: true
    steps:
      - get-workspace
      - setup-git-user:
          git-ssh-fingerprint: << parameters.git-ssh-fingerprint >>
          git-user-email: << parameters.git-user-email >>
          git-user-name: << parameters.git-user-name >>
      - calculate-semantic-version:
          default-version: << parameters.default-version >>
          fallback-to-patch: << parameters.fallback-to-patch >>
      - run:
          name: Creating and pushing semantic version tag
          command: |
            if [[ -z "${SEMANTIC_VERSION}" ]]; then
              echo "No version to release. Skipping tag creation."
              exit 0
            fi

            echo "Creating tag: ${SEMANTIC_VERSION}"
            git tag "${SEMANTIC_VERSION}"
            git push origin "${SEMANTIC_VERSION}"
      - put-directory:
          path: .git
  terraform-plan:
    parameters:
      directory:
        type: string
      setup-steps:
        type: steps
        default: []
      workspace:
        type: string
        default: default
      lock-timeout:
        type: string
        default: "0s"
      backend-config:
        type: string
        description: "passed to terraform plan -backend-config option"
        default: ""
    executor:
      name: buildpack-deps
    steps:
      - get-workspace
      - install-required-terraform-version:
          directory: << parameters.directory >>
      - steps: << parameters.setup-steps >>
      - run:
          name: Installing AWS CLI
          command: |
            if ! which aws > /dev/null; then
              sudo apt-get update --allow-releaseinfo-change && sudo apt-get install -y python3-pip
              sudo pip3 install awscli
            fi
      - run:
          name: Initializing Terraform
          command: |
            cd << parameters.directory >>

            backend_config=""
            if [ "<< parameters.backend-config >>" ]; then
              backend_config=" -backend-config=<< parameters.backend-config >>"
            fi

            terraform init -input=false $backend_config
      - select-or-create-workspace:
          directory: << parameters.directory >>
          workspace-name: << parameters.workspace >>
      - create-terraform-plan:
          directory: << parameters.directory >>
          lock-timeout: << parameters.lock-timeout >>
      - put-path:
          path: << parameters.directory >>/terraform.plan

  terraform-run:
    parameters:
      lock-timeout:
        type: string
        default: "0s"
      directory:
        type: string
      post-plan-steps:
        description: A list of steps to run after the plan. These steps will always run, even if the Terraform apply will not run (in which case post-steps will also not run).
        type: steps
        default: []
      setup-steps:
        type: steps
        default: []
      should-apply:
        type: string
        default: "true"
      workspace:
        type: string
        default: default
    executor:
      name: buildpack-deps
    steps:
      - get-workspace
      - install-required-terraform-version:
          directory: << parameters.directory >>
      - steps: << parameters.setup-steps >>
      - run:
          name: Initializing Terraform
          command: cd << parameters.directory >> && terraform init -input=false
      - select-or-create-workspace:
          directory: << parameters.directory >>
          workspace-name: << parameters.workspace >>
      - create-terraform-plan:
          directory: << parameters.directory >>
          lock-timeout: << parameters.lock-timeout >>
      - run:
          name: Checking if apply should run
          command: |
            if ! << parameters.should-apply >>; then
              circleci-agent step halt
            fi
      - apply-terraform-plan:
          directory: << parameters.directory >>
          ignore-missing-plan: false
          lock-timeout: << parameters.lock-timeout >>
  terraform-apply:
    parameters:
